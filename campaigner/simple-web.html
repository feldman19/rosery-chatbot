<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16352b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ROSERY">
<title>ROSERY</title>
<style>
/* Layout: one column, three tabs (today / ads / ask), sticky header, bottom tab bar. Summary first, detail on tap. */
:root{
  --bg:#f3f5f2;--surface:#ffffff;--ink:#14201b;--muted:#5d6b64;--line:#e1e7e2;
  --brand:#16352b;--brand-soft:#e3ece7;--on-brand:#ffffff;
  --stop:#b3261e;--stop-soft:#fbe9e7;--grow:#1d6b45;--grow-soft:#e2f2e8;--watch:#8a5a00;--watch-soft:#fbf0d9;--idle:#5d6b64;--idle-soft:#eceeec;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Rubik","Heebo","Assistant","Noto Sans Hebrew",Arial,sans-serif;
  --r:16px;--shadow:0 1px 2px rgb(20 32 27/.06),0 4px 16px rgb(20 32 27/.05);
  color-scheme:light
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1513;--surface:#18201d;--ink:#e9efeb;--muted:#9aa9a2;--line:#27322d;
  --brand:#2f6b55;--brand-soft:#1e2b26;--on-brand:#ffffff;
  --stop:#ff8a80;--stop-soft:#3a1d1b;--grow:#6fd39d;--grow-soft:#16301f;--watch:#f2c46b;--watch-soft:#33280f;--idle:#a8b4ae;--idle-soft:#232b28;
  --shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513;--surface:#18201d;--ink:#e9efeb;--muted:#9aa9a2;--line:#27322d;
  --brand:#2f6b55;--brand-soft:#1e2b26;--on-brand:#ffffff;
  --stop:#ff8a80;--stop-soft:#3a1d1b;--grow:#6fd39d;--grow-soft:#16301f;--watch:#f2c46b;--watch-soft:#33280f;--idle:#a8b4ae;--idle-soft:#232b28;
  --shadow:none;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--font);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--brand);z-index:10}
button,textarea,a{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--grow);outline-offset:2px;border-radius:10px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--on-brand)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.logo{font-weight:800;letter-spacing:.22em;font-size:15px}
.fresh{display:flex;align-items:center;gap:8px;font-size:13px;opacity:.9;background:none;border:0;padding:6px 0;color:var(--on-brand)}
.dot{width:8px;height:8px;border-radius:50%;background:#7ee2a8}
.dot.stale{background:#f2c46b}

main{padding-block:20px calc(96px + env(safe-area-inset-bottom,0px))}
section[data-tab]{display:grid;gap:20px}
.hello{display:grid;gap:4px}
.hello h1{font-size:26px;font-weight:750;line-height:1.25}
.hello p{margin:0;color:var(--muted);font-size:17px}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line)}
.stat{padding:14px 12px;display:grid;gap:2px;min-width:0}
.stat+.stat{border-inline-start:1px solid var(--line)}
.stat b{font-size:22px;font-weight:750;line-height:1.2}
.stat span{font-size:13px;color:var(--muted)}
.caption{font-size:13px;color:var(--muted);margin:-12px 4px 0}

.label{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.cards{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:grid;gap:10px;min-width:0}
.card h3{font-size:18px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.card p{margin:0}
.pill{display:inline-flex;align-items:center;gap:6px;width:max-content;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px}
.pill.stop{background:var(--stop-soft);color:var(--stop)}.pill.grow{background:var(--grow-soft);color:var(--grow)}
.pill.watch{background:var(--watch-soft);color:var(--watch)}.pill.idle{background:var(--idle-soft);color:var(--idle)}
.fact{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:15px}
.fact strong{color:var(--ink);font-weight:700}
.change{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700}
.change s{color:var(--muted);font-weight:500}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:650;text-decoration:none}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:var(--brand);flex:1}
.btn.ghost{color:var(--muted)}
details.why summary{list-style:none;color:var(--muted);font-size:14px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
details.why summary::-webkit-details-marker{display:none}
details.why summary::before{content:"›";display:inline-block;transition:transform .15s;font-size:18px;line-height:1}
details.why[open] summary::before{transform:rotate(-90deg)}
details.why div{margin-top:8px;display:grid;gap:6px;font-size:15px;color:var(--muted)}
.note{font-size:14px;color:var(--watch)}
.empty{text-align:center;padding:28px 16px;display:grid;gap:6px;justify-items:center}
.empty .big{width:56px;height:56px;border-radius:50%;background:var(--grow-soft);color:var(--grow);display:grid;place-items:center;font-size:28px;font-weight:800}
.empty p{margin:0;color:var(--muted)}
.link{background:none;border:0;padding:0;color:var(--grow);font-weight:650;text-decoration:underline;text-underline-offset:3px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:block;width:100%;text-align:start;background:none;border:0;padding:14px 16px}
.row+.row,.row-detail+.row{border-top:1px solid var(--line)}
.row-main{display:flex;align-items:center;gap:12px}
.row-text{flex:1;min-width:0;display:grid;gap:2px}
.row-name{font-weight:650;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.row-sub{font-size:14px;color:var(--muted)}
.row-side{display:grid;justify-items:end;gap:4px}
.ret{font-size:18px;font-weight:750}
.ret.stop{color:var(--stop)}.ret.grow{color:var(--grow)}.ret.watch{color:var(--watch)}.ret.idle{color:var(--muted)}
.row-detail{padding:0 16px 16px;display:grid;gap:10px}
.row-detail p{margin:0;color:var(--muted);font-size:15px}

.chat{display:grid;gap:12px}
.bubble{max-width:88%;padding:12px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble.me{justify-self:start;background:var(--brand);color:var(--on-brand);border-end-start-radius:4px}
.bubble.bot{justify-self:end;background:var(--surface);border:1px solid var(--line);border-end-end-radius:4px}
.bubble.wait{color:var(--muted)}
.composer{display:grid;gap:10px}
.composer textarea{width:100%;min-height:96px;resize:vertical;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.unavailable{background:var(--watch-soft);color:var(--watch);padding:12px 14px;border-radius:12px;font-size:15px}

nav.tabs{position:fixed;inset:auto 0 0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{background:none;border:0;min-height:62px;display:grid;justify-items:center;align-content:center;gap:2px;font-size:13px;font-weight:650;color:var(--muted)}
nav.tabs button[aria-selected="true"]{color:var(--brand)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav.tabs button[aria-selected="true"]{color:var(--grow)}}
:root[data-theme="dark"] nav.tabs button[aria-selected="true"]{color:var(--grow)}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;margin-inline-start:22px;margin-top:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--stop);color:#fff;font-size:11px;display:grid;place-items:center}
.tab-icon{position:relative;display:grid;justify-items:center}
.foot{text-align:center;font-size:14px;color:var(--muted)}
.foot a{color:var(--muted)}
.skeleton{height:120px;border-radius:var(--r);background:var(--line);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header><div class="wrap"><span class="logo">ROSERY</span><button class="fresh" id="fresh" type="button" aria-label="רענן נתונים"><span class="dot" id="fresh-dot"></span><span id="fresh-text">טוען…</span></button></div></header>

<main class="wrap">
  <section data-tab="today" aria-labelledby="hello-title">
    <div class="hello"><h1 id="hello-title">שלום</h1><p id="hello-sub">בודק מה קורה בפרסום…</p></div>
    <div class="stats" id="stats" aria-label="אתמול"></div>
    <p class="caption" id="stats-caption"></p>
    <div class="label" id="todo-label">מה לעשות היום</div>
    <div class="cards" id="todo"><div class="skeleton"></div></div>
    <div class="label" id="done-label" hidden>מה קרה אחרי מה שעשית</div>
    <div class="cards" id="done"></div>
  </section>

  <section data-tab="ads" hidden aria-labelledby="ads-title">
    <div class="hello"><h1 id="ads-title">המודעות שלך</h1><p id="ads-sub">3 הימים האחרונים</p></div>
    <div class="chips" id="filters" role="group" aria-label="סינון"></div>
    <div class="list" id="ads"></div>
  </section>

  <section data-tab="ask" hidden aria-labelledby="ask-title">
    <div class="hello"><h1 id="ask-title">שאל על הפרסום</h1><p>שאלה פשוטה, תשובה פשוטה. שום דבר לא משתנה בחשבון.</p></div>
    <div class="chips" id="suggest"></div>
    <div class="chat" id="chat" aria-live="polite"></div>
    <div id="chat-unavailable" class="unavailable" hidden></div>
    <form class="composer" id="composer"><label class="label" for="question">השאלה שלך</label><textarea id="question" placeholder="למשל: איזו מודעה הכי משתלמת השבוע?" maxlength="1000"></textarea><button class="btn primary" id="send" type="submit">שלח</button></form>
  </section>

  <p class="foot"><a href="/advanced">למסך המלא</a></p>
</main>

<nav class="tabs" aria-label="ניווט"><div class="wrap" role="tablist">
  <button type="button" role="tab" data-go="today" aria-selected="true"><span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span class="badge" id="badge" hidden></span></span>היום</button>
  <button type="button" role="tab" data-go="ads" aria-selected="false"><span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M8 15h5"/></svg></span>מודעות</button>
  <button type="button" role="tab" data-go="ask" aria-selected="false"><span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></span>שאל</button>
</div></nav>

<script>
const token='__SESSION__';
const $=id=>document.getElementById(id);
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
const ils=v=>typeof v==='number'?'₪'+Math.round(v).toLocaleString('he-IL'):'—';
const x=v=>typeof v==='number'?v.toFixed(2):'—';
// Plain-language mapping of the owner's rulebook verdicts.
const KIND={PAUSE:['stop','לעצור'],SCALE:['grow','להגדיל'],SUCCESS:['grow','מצליחה'],HOLD:['watch','בינונית'],
  KEEP_TESTING:['watch','בבדיקה'],UNTESTED:['idle','מעט תקציב'],INSUFFICIENT_DATA:['idle','חסר מידע']};
const GROUP={PAUSE:'act',SCALE:'act',SUCCESS:'good',HOLD:'good',KEEP_TESTING:'test',UNTESTED:'test',INSUFFICIENT_DATA:'test'};
let report=null,filter='all',open=null,showQuiet=false;

async function api(path,body){
  const r=await fetch(path,{cache:'no-store',credentials:'same-origin',headers:{'X-Local-Session':token,...(body?{'Content-Type':'application/json'}:{})},...(body?{method:'POST',body:JSON.stringify(body)}:{})});
  let data=null;try{data=await r.json()}catch{}
  if(!r.ok)throw Error(data&&typeof data.error==='string'?data.error:'לא הצלחנו להתחבר למערכת');
  return data;
}
function dismissed(){try{return JSON.parse(localStorage.getItem('rosery-dismissed-'+(report?.recommendations?.today?.window?.until||''))||'[]')}catch{return[]}}
function dismiss(id){try{const d=dismissed();d.push(id);localStorage.setItem('rosery-dismissed-'+(report?.recommendations?.today?.window?.until||''),JSON.stringify(d))}catch{}renderToday()}

function go(tab){
  for(const s of document.querySelectorAll('section[data-tab]'))s.hidden=s.dataset.tab!==tab;
  for(const b of document.querySelectorAll('[data-go]'))b.setAttribute('aria-selected',String(b.dataset.go===tab));
  if(tab==='ask')loadChat();
  window.scrollTo(0,0);
}
for(const b of document.querySelectorAll('[data-go]'))b.onclick=()=>go(b.dataset.go);

function greeting(){const h=new Date().getHours();return h<5?'לילה טוב':h<12?'בוקר טוב':h<17?'צהריים טובים':h<21?'ערב טוב':'לילה טוב'}
function decisions(){return report?.recommendations?.rule_engine?.decisions||[]}
function decisionFor(id){return decisions().find(d=>d.entity_id===id)}

function renderHeader(){
  const f=report?.freshness||{},at=f.meta_last_success_at?new Date(f.meta_last_success_at):null,fresh=f.state==='fresh';
  $('fresh-dot').className='dot'+(fresh?'':' stale');
  const mins=at?Math.max(0,Math.round((Date.now()-at)/60000)):null;
  $('fresh-text').textContent=mins===null?'אין נתונים':mins<2?'עודכן עכשיו':mins<60?'עודכן לפני '+mins+' דק׳':'עודכן ב-'+at.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
}

function renderStats(){
  const w=report?.windows?.['1']||{},m=w.metrics||{},box=$('stats');box.replaceChildren();
  const ret=typeof m.attributed_revenue==='number'&&m.spend?m.attributed_revenue/m.spend:m.roas;
  for(const [value,label] of [[ils(m.spend),'הוצאה'],[typeof m.purchases==='number'?String(Math.round(m.purchases)):'—','מכירות'],[typeof ret==='number'?'₪'+x(ret):'—','החזר על ₪1']]){
    const s=el('div','stat');s.append(el('b','num',value),el('span','',label));box.append(s)}
  $('stats-caption').textContent=w.until?'אתמול ('+w.until.split('-').reverse().slice(0,2).join('.')+') · לפי מטא':'';
}

function actionCard(item){
  const d=item.proposal_id&&item.proposal_id.startsWith('pause:')?decisionFor(item.proposal_id.slice(6)):null;
  const card=el('article','card'),[cls,word]=item.action==='PAUSE'?['stop','לעצור']:item.action==='SCALE'?['grow','להגדיל תקציב']:item.action==='ALERT'?['idle','לתשומת לב']:['watch','לשים עין'];
  card.append(el('span','pill '+cls,word));
  const title=(item.headline.match(/"([^"]+)"/)||[])[1]||item.headline;card.append(el('h3','',title));
  if(item.action==='PAUSE'&&d){
    const f=el('div','fact');f.append(factPart('הוציאה',ils(d.numbers.spend)),factPart('מכירות',String(d.numbers.purchases??'—')),factPart('החזר על ₪1','₪'+x(d.numbers.roas)));card.append(f);
    card.append(el('p','','מוציאה יותר ממה שהיא מכניסה. עצירה חוסכת כ-'+ils(item.saving_per_day)+' ביום.'));
  }else if(item.action==='SCALE'){
    const m=item.headline.match(/₪([\d,]+)\D+₪([\d,]+)/);
    if(m){const c=el('div','change');c.append(el('s','num','₪'+m[1]),el('span','','←'),el('span','num','₪'+m[2]),el('span','',' ביום'));card.append(c)}
    card.append(el('p','',item.body.replace(/^\d+ מודעות ווינר באד-סט: /,'מנצחת: ')+'. מגדילים ב-20% בלבד, כמו בחוקים שלך.'));
  }else card.append(el('p','',item.body));
  const why=el('details','why');why.append(el('summary','','למה?'));const inner=el('div');inner.append(el('p','',item.body));
  for(const w of item.warnings||[])inner.append(el('p','note',w));why.append(inner);card.append(why);
  if(item.kind==='approve'&&!item.ready_for_approval)card.append(el('p','note','צריך לרענן נתונים לפני ביצוע.'));
  const a=el('div','actions');
  if(item.link){const l=el('a','btn primary','לביצוע במטא');l.href=item.link;l.target='_blank';l.rel='noopener noreferrer';a.append(l)}
  if(item.kind==='approve'&&item.proposal_id){const done=el('button','btn','ביצעתי');done.type='button';done.onclick=()=>markDone(item.proposal_id,done);a.append(done)}
  const later=el('button','btn ghost','לא עכשיו');later.type='button';later.onclick=()=>dismiss(item.headline);a.append(later);
  card.append(a);return card;
}
// Local record only: says the owner made the change in Meta. Nothing is sent to Meta.
async function markDone(id,button){
  button.disabled=true;
  try{await api('/api/outcomes/mark',{proposal_id:id});await loadOutcomes();renderToday()}
  catch(e){button.disabled=false;alert(e.message)}
}
async function answerDetected(id,answer){
  try{await api('/api/outcomes/answer',{action_id:id,answer});await loadOutcomes();renderToday()}catch(e){alert(e.message)}
}
const PHASE={waiting:['idle','ממתין לנתונים'],preliminary:['watch','תוצאה ראשונית'],final:['grow','תוצאה סופית'],
  different_change:['watch','שינוי שונה מההצעה'],unverified:['idle','עוד לא אומת במטא'],incomplete:['idle','חסרים נתונים']};
function outcomeCard(o){
  const card=el('article','card'),[cls,word]=PHASE[o.phase]||['idle',o.phase];
  card.append(el('span','pill '+cls,word));
  const title=(o.headline.match(/"([^"]+)"/)||[])[1]||o.headline;
  card.append(el('h3','',(o.kind==='pause'?'השהית את ':'הגדלת את ')+title));
  card.append(el('p','fact','השינוי ב-'+o.change_day.split('-').reverse().slice(0,2).join('.')+(o.source==='auto_detected'?' · זוהה בנתוני מטא':' · לפי הסימון שלך')));
  if(o.needs_answer){
    card.append(el('p','','זיהינו בנתוני מטא שהשינוי בוצע. זה היה לפי ההצעה?'));
    const a=el('div','actions'),yes=el('button','btn primary','כן, לפי ההצעה'),no=el('button','btn ghost','לא');
    yes.type=no.type='button';yes.onclick=()=>answerDetected(o.id,'yes');no.onclick=()=>answerDetected(o.id,'no');a.append(yes,no);card.append(a);
  }
  for(const line of o.lines||[])card.append(el('p','',line));
  for(const w of o.warnings||[])card.append(el('p','note',w));
  return card;
}
let outcomes=null;
async function loadOutcomes(){try{outcomes=await api('/api/outcomes')}catch{outcomes=null}renderOutcomes()}
function renderOutcomes(){
  const box=$('done'),items=outcomes?.items||[];box.replaceChildren();$('done-label').hidden=!items.length;
  for(const o of items)box.append(outcomeCard(o));
  if(items.length)box.append(el('p','caption',outcomes.note));
}
function factPart(label,value){const s=el('span');s.append(label+' ',el('strong','num',value));return s}

function renderToday(){
  const today=report?.recommendations?.today,hidden=new Set(dismissed());
  // Proposals already marked or detected as done move to the results section.
  const tracked=new Set((outcomes?.items||[]).map(o=>o.proposal_id));
  $('hello-title').textContent=greeting();
  const items=(today?.items||[]).filter(i=>!hidden.has(i.headline)&&!tracked.has(i.proposal_id)),todo=$('todo');todo.replaceChildren();
  const approve=items.filter(i=>i.kind==='approve').length;
  $('badge').hidden=!approve;$('badge').textContent=String(approve);
  if(!today){$('hello-sub').textContent='אין עדיין נתונים. לחץ על "רענן" למעלה.';return}
  if(today.status==='blocked'){$('hello-sub').textContent='לא הצלחתי לבדוק היום — חסרים נתונים.';todo.append(emptyState('!','צריך לרענן נתונים','לחץ על הנקודה למעלה כדי למשוך נתונים חדשים ממטא.'));return}
  $('hello-sub').textContent=approve?(approve===1?'דבר אחד מחכה לך היום':approve+' דברים מחכים לך היום'):'הכל רץ כמו שצריך';
  $('todo-label').hidden=!items.length;
  if(!items.length){const c=today.counts||{};todo.append(emptyState('✓','אין מה לשנות היום',(c.SUCCESS||0)+(c.HOLD||0)+' מודעות רצות טוב, '+((c.KEEP_TESTING||0)+(c.UNTESTED||0))+' עדיין בבדיקה.'))}
  for(const i of items)todo.append(actionCard(i));
  if(items.length){const more=el('button','link','לכל המודעות ←');more.type='button';more.onclick=()=>go('ads');todo.append(more)}
}
function emptyState(icon,title,text){const e=el('div','card empty');e.append(el('div','big',icon),el('h3','',title),el('p','',text));return e}

function renderAds(){
  const all=decisions(),counts={all:all.length,act:0,good:0,test:0};for(const d of all)counts[GROUP[d.action]]++;
  const f=$('filters');f.replaceChildren();
  for(const [key,label] of [['all','הכל'],['act','דורש פעולה'],['good','רצות טוב'],['test','בבדיקה']]){
    if(key!=='all'&&!counts[key])continue;
    const b=el('button','chip',label+' '+counts[key]);b.type='button';b.setAttribute('aria-pressed',String(filter===key));b.onclick=()=>{filter=key;renderAds()};f.append(b)}
  const w=report?.recommendations?.rule_engine?.window;$('ads-sub').textContent=w?'3 ימים מלאים · '+w.since.split('-').reverse().slice(0,2).join('.')+'–'+w.until.split('-').reverse().slice(0,2).join('.'):'3 הימים האחרונים';
  const list=$('ads');list.replaceChildren();
  const matching=all.filter(d=>filter==='all'||GROUP[d.action]===filter);
  // Ads that barely spent are noise for a quick look; keep them one tap away.
  const quiet=matching.filter(d=>d.action==='UNTESTED'),rows=showQuiet?matching:matching.filter(d=>d.action!=='UNTESTED');
  if(!matching.length){list.append(emptyState('·','אין מודעות להצגה','רענן נתונים או בחר סינון אחר.'));return}
  for(const d of rows){
    const n=d.numbers,promising=d.action==='KEEP_TESTING'&&typeof n.roas==='number'&&n.roas>3;
    const [cls,word]=promising?['grow','מבטיחה']:KIND[d.action]||['idle',d.label];
    const row=el('button','row');row.type='button';row.setAttribute('aria-expanded',String(open===d.entity_id));
    const main=el('div','row-main'),text=el('div','row-text'),side=el('div','row-side');
    text.append(el('span','row-name',d.entity_name),el('span','row-sub',ils(n.spend)+' · '+(n.purchases??'—')+' מכירות'));
    side.append(el('span','ret num '+cls,typeof n.roas==='number'?x(n.roas)+'×':'—'),el('span','pill '+cls,word));
    main.append(text,side);row.append(main);row.onclick=()=>{open=open===d.entity_id?null:d.entity_id;renderAds()};list.append(row);
    if(open===d.entity_id){
      const det=el('div','row-detail');det.append(el('p','',d.why));
      if(d.adset_name)det.append(el('p','','קבוצה: '+d.adset_name));
      const l=el('a','btn','פתח במטא');l.href=d.ads_manager_url;l.target='_blank';l.rel='noopener noreferrer';det.append(l);list.append(det)}
  }
  if(quiet.length){const q=el('button','row');q.type='button';const t=el('div','row-main');
    t.append(el('span','row-sub',showQuiet?'הסתר מודעות עם מעט תקציב':'+ עוד '+quiet.length+' מודעות שקיבלו מעט תקציב (עוד לא נבדקו)'));q.append(t);
    q.onclick=()=>{showQuiet=!showQuiet;renderAds()};list.append(q)}
}

let chatTimer=null;
async function loadChat(){
  const s=$('suggest');if(!s.childElementCount)for(const q of ['איזו מודעה הכי משתלמת?','למה לעצור את המודעה?','כמה להוציא מחר?']){const c=el('button','chip',q);c.type='button';c.onclick=()=>{$('question').value=q;$('question').focus()};s.append(c)}
  try{const st=await api('/api/claude-chat');renderChat(st)}catch(e){showUnavailable(e.message)}
}
function showUnavailable(text){$('chat-unavailable').hidden=false;$('chat-unavailable').textContent=text}
function renderChat(st){
  const chat=$('chat');chat.replaceChildren();
  if(st&&st.authenticated===false)showUnavailable('השיחה עובדת רק כש-Claude מחובר במחשב שבו המערכת רצה.');
  for(const t of (st?.turns||[]).slice(-10)){chat.append(el('div','bubble me',t.question));
    chat.append(el('div','bubble bot'+(t.answer?'':' wait'),t.answer||(t.state==='failed'?'לא התקבלה תשובה. נסה שוב.':'חושב…')))}
  const waiting=(st?.turns||[]).some(t=>t.state==='running');clearTimeout(chatTimer);
  if(waiting)chatTimer=setTimeout(loadChat,2500);
}
$('composer').onsubmit=async e=>{
  e.preventDefault();const q=$('question').value.trim();if(q.length<3)return;
  $('send').disabled=true;
  try{await api('/api/claude-chat',{question:q,request_id:crypto.randomUUID(),ad_id:null});$('question').value='';await loadChat()}
  catch(err){showUnavailable(err.message)}finally{$('send').disabled=false}
};

async function load(refresh){
  if(refresh){$('fresh-text').textContent='מרענן…';try{await api('/api/live/refresh',{})}catch{}}
  try{report=await api('/api/management-report')}catch(e){$('hello-sub').textContent=e.message;$('todo').replaceChildren();return}
  await loadOutcomes();
  renderHeader();renderStats();renderToday();renderAds();
}
$('fresh').onclick=()=>load(true);
load(false);setInterval(()=>load(false),5*60*1000);
</script>
